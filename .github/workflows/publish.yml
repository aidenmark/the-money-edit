# Publish the site to GitHub Pages.
#
# Why this runs in CI rather than on the laptop. The entries are written by a
# scheduled task every weekday morning, but the laptop is not reliably open,
# so anything that needs a manual trigger gets missed. Running the build on a
# schedule means the site keeps up with Notion regardless.
#
# This costs nothing. No language model runs here. The job calls the Notion
# REST API and writes HTML, and Actions minutes are free on a public
# repository. The earlier decision to avoid CI was about the cost of running
# Claude on every build, which is a different thing and still stands.

name: Publish

on:
  # The brief runs twice a weekday, so the site rebuilds twice.
  #
  # Cron here is UTC, ignores daylight saving, and runs late. Two separate
  # limits shape this schedule, and they pull against each other.
  #
  # The first is delay. Runs start behind their cron time, 29 to 44 minutes in
  # the morning window and 14 to 21 in the evening, and the delay hits the whole
  # window at once rather than each run separately. Two crons ten minutes apart
  # started seven minutes apart, both about forty minutes late. So a cron cannot
  # be aimed at a moment. What survives the delay is spacing, which is why the
  # windows below are spread rather than pointed.
  #
  # The second is throttling, and it is the one that bit hardest. This file
  # briefly ran '*/10' across both windows, asking for 48 builds a weekday.
  # GitHub delivered 1 to 3, at delays as long as four hours, and the site went
  # a full day stale. The previous schedule of ten discrete crons had been
  # delivering 10 to 13 runs a day reliably. Asking for more produced far less.
  #
  #   48 crons requested  ->  1 to 3 delivered
  #   10 crons requested  ->  10 to 13 delivered
  #
  # So the ceiling is roughly a dozen, and spacing has to be bought within that
  # budget rather than on top of it. Fourteen crons, thirty five minutes apart,
  # placed early enough that the queue delay lands them inside the window rather
  # than after it.
  #
  #   entries land   9:05 to 10:25am Eastern   =  13:05 to 15:25 UTC year round
  #                  5:16 to 6:40pm Eastern    =  21:16 to 23:40 UTC year round
  #
  # Both seasons still fall inside one span per edition, so nothing has to
  # change twice a year.
  #
  # The honest guarantee is a build within about thirty five minutes of an
  # entry, not the ten the '*/10' version promised and did not deliver. For
  # anything faster, see repository_dispatch below.
  schedule:
    - cron: '15 12 * * 1-5'
    - cron: '50 12 * * 1-5'
    - cron: '25 13 * * 1-5'
    - cron: '0 14 * * 1-5'
    - cron: '35 14 * * 1-5'
    - cron: '10 15 * * 1-5'
    - cron: '45 15 * * 1-5'
    - cron: '30 20 * * 1-5'
    - cron: '5 21 * * 1-5'
    - cron: '40 21 * * 1-5'
    - cron: '15 22 * * 1-5'
    - cron: '50 22 * * 1-5'
    - cron: '25 23 * * 1-5'
    - cron: '55 23 * * 1-5'

  # Publish on demand from outside GitHub. This is how the scheduled task can
  # rebuild the site the moment it finishes writing an entry, instead of the
  # site waiting for the next cron.
  #
  # The task fires it with a fine grained token holding only Contents write on
  # this repository:
  #
  #   curl -X POST \
  #     -H "Authorization: Bearer $TOKEN" \
  #     -H "Accept: application/vnd.github+json" \
  #     https://api.github.com/repos/aidenmark/the-money-edit/dispatches \
  #     -d '{"event_type":"entry-published"}'
  #
  # Kept, but nothing fires it today. The scheduled claude.ai tasks that write
  # the entries are blocked from reaching api.github.com by a proxy in their run
  # environment, which answers repository_dispatch with a 403 regardless of how
  # the token is scoped. It works from anywhere with real network access, so the
  # trigger stays available. See docs/scheduled-tasks.md.
  repository_dispatch:
    types: [entry-published]

  # Republish whenever the site code itself changes.
  push:
    branches: [main]

  # The publish now button, for when an entry is promoted out of Draft and
  # should not wait for the next scheduled run.
  workflow_dispatch:

# The minimum the deploy needs. Pages deployment uses OIDC, which is why
# id-token is required.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. Queue instead of cancelling, so a scheduled run
# already uploading is allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build from Notion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Run tests
        run: npm test

      - name: Build the site
        env:
          # Set with: gh secret set NOTION_TOKEN
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
