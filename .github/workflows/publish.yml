# Publish the site to GitHub Pages.
#
# Why this runs in CI rather than on the laptop. The entries are written by a
# scheduled task every weekday morning, but the laptop is not reliably open,
# so anything that needs a manual trigger gets missed. Running the build on a
# schedule means the site keeps up with Notion regardless.
#
# This costs nothing. No language model runs here. The job calls the Notion
# REST API and writes HTML, and Actions minutes are free on a public
# repository. The earlier decision to avoid CI was about the cost of running
# Claude on every build, which is a different thing and still stands.

name: Publish

on:
  # The entry is filed at 9:30am Eastern and the task publishes it directly,
  # so this build is the only thing between an entry being written and being
  # readable. The notification goes out at 9:30, which means anything later
  # than a few minutes leaves a reader tapping through to yesterday's card.
  #
  # Cron in Actions is always UTC and does not follow daylight saving, so each
  # Eastern time is two UTC times across the year. Both are listed, and one of
  # each pair is a harmless no change rebuild depending on the season. Builds
  # are free, a daylight saving bug that surfaces twice a year is not.
  #
  # 13:35 and 14:35 UTC are 9:35 Eastern. 13:50 and 14:50 are the retry, since
  # GitHub does not guarantee cron punctuality and delays of ten minutes or
  # more happen under load. 22:00 catches an entry edited later in the day.
  #
  # For a build that actually lands at 9:31 rather than 9:35 at best, see the
  # repository_dispatch trigger below. Cron is the fallback, not the plan.
  schedule:
    - cron: '35 13 * * 1-5'
    - cron: '50 13 * * 1-5'
    - cron: '35 14 * * 1-5'
    - cron: '50 14 * * 1-5'
    - cron: '0 22 * * 1-5'

  # Publish on demand from outside GitHub. This is how the scheduled task can
  # rebuild the site the moment it finishes writing an entry, instead of the
  # site waiting for the next cron.
  #
  # The task fires it with a fine grained token holding only Contents write on
  # this repository:
  #
  #   curl -X POST \
  #     -H "Authorization: Bearer $TOKEN" \
  #     -H "Accept: application/vnd.github+json" \
  #     https://api.github.com/repos/aidenmark/the-money-edit/dispatches \
  #     -d '{"event_type":"entry-published"}'
  #
  # Until that is wired up the crons cover it, just less promptly.
  repository_dispatch:
    types: [entry-published]

  # Republish whenever the site code itself changes.
  push:
    branches: [main]

  # The publish now button, for when an entry is promoted out of Draft and
  # should not wait for the next scheduled run.
  workflow_dispatch:

# The minimum the deploy needs. Pages deployment uses OIDC, which is why
# id-token is required.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. Queue instead of cancelling, so a scheduled run
# already uploading is allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build from Notion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run tests
        run: npm test

      - name: Build the site
        env:
          # Set with: gh secret set NOTION_TOKEN
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
