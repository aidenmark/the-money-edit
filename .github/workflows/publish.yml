# Publish the site to GitHub Pages.
#
# Why this runs in CI rather than on the laptop. The entries are written by a
# scheduled task every weekday morning, but the laptop is not reliably open,
# so anything that needs a manual trigger gets missed. Running the build on a
# schedule means the site keeps up with Notion regardless.
#
# This costs nothing. No language model runs here. The job calls the Notion
# REST API and writes HTML, and Actions minutes are free on a public
# repository. The earlier decision to avoid CI was about the cost of running
# Claude on every build, which is a different thing and still stands.

name: Publish

on:
  # The brief runs twice a weekday, so the site rebuilds twice.
  #
  #   Opening bell   task writes ~9:00am Eastern, builds at 9:10 and 9:20
  #   Closing bell   task writes ~5:15pm Eastern, builds at 5:30 and 5:45
  #
  # Each pair is a real run plus a retry, because GitHub does not guarantee
  # cron punctuality and delays of ten minutes or more happen under load. The
  # morning pair still lands before the 9:30 opening bell even when delayed.
  #
  # Cron in Actions is always UTC and ignores daylight saving, so every Eastern
  # time is listed twice. One of each pair is a harmless no change rebuild
  # depending on the season, which costs nothing and removes a whole class of
  # twice yearly bug:
  #
  #   13:10 / 13:20 UTC  =  9:10 / 9:20am Eastern in summer
  #   14:10 / 14:20 UTC  =  9:10 / 9:20am Eastern in winter
  #   21:30 / 21:45 UTC  =  5:30 / 5:45pm Eastern in summer
  #   22:30 / 22:45 UTC  =  5:30 / 5:45pm Eastern in winter
  #
  # For a build that lands within a minute of the entry rather than waiting for
  # a scheduler, see repository_dispatch below. Cron is the fallback.
  schedule:
    - cron: '10 13 * * 1-5'
    - cron: '20 13 * * 1-5'
    - cron: '10 14 * * 1-5'
    - cron: '20 14 * * 1-5'
    # Late morning catches, for a research run that takes longer than usual.
    # Without these, a winter morning task running past 9:20 Eastern would
    # leave the card unpublished until the evening pass at 4:30pm, because
    # the next cron after 14:20 UTC is 21:30. Summer is already covered by
    # the off season pair at 14:10 and 14:20, which land at 10:10 and 10:20
    # Eastern. These two give winter the same safety net.
    - cron: '35 14 * * 1-5'
    - cron: '0 15 * * 1-5'
    - cron: '30 21 * * 1-5'
    - cron: '45 21 * * 1-5'
    - cron: '30 22 * * 1-5'
    - cron: '45 22 * * 1-5'

  # Publish on demand from outside GitHub. This is how the scheduled task can
  # rebuild the site the moment it finishes writing an entry, instead of the
  # site waiting for the next cron.
  #
  # The task fires it with a fine grained token holding only Contents write on
  # this repository:
  #
  #   curl -X POST \
  #     -H "Authorization: Bearer $TOKEN" \
  #     -H "Accept: application/vnd.github+json" \
  #     https://api.github.com/repos/aidenmark/the-money-edit/dispatches \
  #     -d '{"event_type":"entry-published"}'
  #
  # All four claude.ai tasks carry this. Measured cron lag on 2026-08-19 was
  # 29 to 42 minutes, so without the dispatch the notification points at a
  # page that has not rebuilt yet. See docs/scheduled-tasks.md.
  repository_dispatch:
    types: [entry-published]

  # Republish whenever the site code itself changes.
  push:
    branches: [main]

  # The publish now button, for when an entry is promoted out of Draft and
  # should not wait for the next scheduled run.
  workflow_dispatch:

# The minimum the deploy needs. Pages deployment uses OIDC, which is why
# id-token is required.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. Queue instead of cancelling, so a scheduled run
# already uploading is allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build from Notion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Run tests
        run: npm test

      - name: Build the site
        env:
          # Set with: gh secret set NOTION_TOKEN
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
