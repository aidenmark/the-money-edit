# Publish the site to GitHub Pages.
#
# Why this runs in CI rather than on the laptop. The entries are written by a
# scheduled task every weekday morning, but the laptop is not reliably open,
# so anything that needs a manual trigger gets missed. Running the build on a
# schedule means the site keeps up with Notion regardless.
#
# This costs nothing. No language model runs here. The job calls the Notion
# REST API and writes HTML, and Actions minutes are free on a public
# repository. The earlier decision to avoid CI was about the cost of running
# Claude on every build, which is a different thing and still stands.

name: Publish

on:
  # The brief is written after the closing bell, not before the opening one.
  #
  # The reason is the content. The entry format is what happened, why it
  # happened, and the key figures, which is a complete story and needs a
  # completed session. Closing prices are final by 4:05pm Eastern, and the
  # journalism that explains the day publishes between 4:15 and 5:30. Before
  # the open there is nothing but futures, which for a long term reader is
  # noise. An evening entry is also dated the same day it describes, where a
  # morning one would be dated the day after the session it reports.
  #
  # Task writes at 5:15pm Eastern. Build at 5:30 with a retry at 5:45, since
  # GitHub does not guarantee cron punctuality and delays of ten minutes or
  # more happen under load.
  #
  # Cron in Actions is always UTC and ignores daylight saving, so each Eastern
  # time is listed twice. One of each pair is a harmless no change rebuild:
  #
  #   21:30 / 21:45 UTC  =  5:30 / 5:45pm Eastern in summer
  #   22:30 / 22:45 UTC  =  5:30 / 5:45pm Eastern in winter
  #
  # The 12:00 UTC pass is a morning safety net, so anything edited overnight is
  # live by the time anyone looks.
  #
  # For a build that lands within a minute of the entry rather than waiting for
  # a scheduler, see repository_dispatch below. Cron is the fallback.
  schedule:
    - cron: '30 21 * * 1-5'
    - cron: '45 21 * * 1-5'
    - cron: '30 22 * * 1-5'
    - cron: '45 22 * * 1-5'
    - cron: '0 12 * * 1-5'

  # Publish on demand from outside GitHub. This is how the scheduled task can
  # rebuild the site the moment it finishes writing an entry, instead of the
  # site waiting for the next cron.
  #
  # The task fires it with a fine grained token holding only Contents write on
  # this repository:
  #
  #   curl -X POST \
  #     -H "Authorization: Bearer $TOKEN" \
  #     -H "Accept: application/vnd.github+json" \
  #     https://api.github.com/repos/aidenmark/the-money-edit/dispatches \
  #     -d '{"event_type":"entry-published"}'
  #
  # Until that is wired up the crons cover it, just less promptly.
  repository_dispatch:
    types: [entry-published]

  # Republish whenever the site code itself changes.
  push:
    branches: [main]

  # The publish now button, for when an entry is promoted out of Draft and
  # should not wait for the next scheduled run.
  workflow_dispatch:

# The minimum the deploy needs. Pages deployment uses OIDC, which is why
# id-token is required.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. Queue instead of cancelling, so a scheduled run
# already uploading is allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build from Notion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run tests
        run: npm test

      - name: Build the site
        env:
          # Set with: gh secret set NOTION_TOKEN
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
