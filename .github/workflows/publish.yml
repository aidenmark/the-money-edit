# Publish the site to GitHub Pages.
#
# Why this runs in CI rather than on the laptop. The entries are written by a
# scheduled task every weekday morning, but the laptop is not reliably open,
# so anything that needs a manual trigger gets missed. Running the build on a
# schedule means the site keeps up with Notion regardless.
#
# This costs nothing. No language model runs here. The job calls the Notion
# REST API and writes HTML, and Actions minutes are free on a public
# repository. The earlier decision to avoid CI was about the cost of running
# Claude on every build, which is a different thing and still stands.

name: Publish

on:
  # The brief runs twice a weekday, so the site rebuilds twice.
  #
  # Cron here is UTC, ignores daylight saving, and runs late. Measured over
  # three days of live operation, every scheduled run started behind its cron
  # time: 29 to 44 minutes in the morning window, 14 to 21 minutes in the
  # evening. Nothing was dropped, it is a queue delay.
  #
  # That delay hits the whole window at once rather than each run separately.
  # Two crons ten minutes apart started seven minutes apart, both about forty
  # minutes late. So a cron cannot be aimed at a moment. Pointing one at 13:10
  # to catch a 13:05 entry simply produces a build at 13:52.
  #
  # What survives the delay is spacing. If runs are scheduled every ten minutes
  # they execute every ten minutes, wherever the queue happens to put them. So
  # the guarantee this workflow makes is not "a build at 9:10am" but "a build
  # within about ten minutes of whenever the entry lands", which is the thing
  # that actually matters and the only one that is achievable.
  #
  # The windows start an hour before the earliest possible entry so that
  # execution has already begun by the time one appears, even at the worst lag
  # seen so far.
  #
  #   entries land   9:05 to 10:25am Eastern   =  13:05 to 15:25 UTC year round
  #                  5:16 to 6:40pm Eastern    =  21:16 to 23:40 UTC year round
  #
  # Both seasons are covered by one expression each, because the window is wide
  # enough to hold the Eastern time in either offset. That removes the pairs of
  # season specific crons this file used to carry, and with them a whole class
  # of twice yearly bug.
  #
  # This is polling, and it is polling because the alternative is unavailable.
  # See repository_dispatch below.
  schedule:
    - cron: '*/10 12-15 * * 1-5'
    - cron: '*/10 20-23 * * 1-5'

  # Publish on demand from outside GitHub. This is how the scheduled task can
  # rebuild the site the moment it finishes writing an entry, instead of the
  # site waiting for the next cron.
  #
  # The task fires it with a fine grained token holding only Contents write on
  # this repository:
  #
  #   curl -X POST \
  #     -H "Authorization: Bearer $TOKEN" \
  #     -H "Accept: application/vnd.github+json" \
  #     https://api.github.com/repos/aidenmark/the-money-edit/dispatches \
  #     -d '{"event_type":"entry-published"}'
  #
  # Kept, but nothing fires it today. The scheduled claude.ai tasks that write
  # the entries are blocked from reaching api.github.com by a proxy in their run
  # environment, which answers repository_dispatch with a 403 regardless of how
  # the token is scoped. It works from anywhere with real network access, so the
  # trigger stays available. See docs/scheduled-tasks.md.
  repository_dispatch:
    types: [entry-published]

  # Republish whenever the site code itself changes.
  push:
    branches: [main]

  # The publish now button, for when an entry is promoted out of Draft and
  # should not wait for the next scheduled run.
  workflow_dispatch:

# The minimum the deploy needs. Pages deployment uses OIDC, which is why
# id-token is required.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. Queue instead of cancelling, so a scheduled run
# already uploading is allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build from Notion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Run tests
        run: npm test

      - name: Build the site
        env:
          # Set with: gh secret set NOTION_TOKEN
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
